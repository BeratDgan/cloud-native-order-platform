apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aks-platform
  namespace: argocd
spec:
  project: cloud-native-platform
  source:
    repoURL: git@github.com:BeratDgan/cloud-native-order-platform.git
    targetRevision: main
    path: gitops/aks-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  # Rollouts controller canary boyunca bu iki alani degistirir. ArgoCD'nin
  # self-heal ile agirliklari Git'teki 100/0 degerine geri zorlamasi engellenir.
  ignoreDifferences:
    - group: networking.istio.io
      kind: VirtualService
      name: platform-ingress
      namespace: demo
      jsonPointers:
        - /spec/http/1/route/0/weight
        - /spec/http/1/route/1/weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - RespectIgnoreDifferences=true
