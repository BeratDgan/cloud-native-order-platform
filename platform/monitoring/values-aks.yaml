prometheus:
  prometheusSpec:
    replicas: 1
    retention: 24h # bu değer, Prometheus'un veri saklama süresini belirler
    retentionSize: "3GB" # bu değer, Prometheus'un veri saklama boyutunu belirler
    scrapeInterval: 30s # bu değer, Prometheus'un veri toplama sıklığını belirler
    evaluationInterval: 30s # bu değer, Prometheus'un veri değerlendirme sıklığını belirler
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    podMetadata:
      labels:
        sidecar.istio.io/inject: "true" # Istio sidecar'ının Prometheus pod'una enjekte edilmesini sağlar

grafana:

  service:
    type: ClusterIP
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: false
  persistence:
    enabled: true
    storageClassName: managed-csi
    size: 1Gi
  deploymentStrategy:
    type: Recreate
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 512Mi
  
  sidecar:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        memory: 64Mi
        cpu: 25m
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 128Mi

# AKS control plane Microsoft tarafindan yonetilir; bu endpoint'lere
# cluster icinden dogrudan erisemedigimiz icin bosuna alarm uretmelerini kapatiyoruz.
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

# Cluster Cilium veri duzlemi kullaniyor ve kube-proxy pod'u calistirmiyor.
kubeProxy:
  enabled: false
