global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    fsGroup: 473
    seccompProfile:
      type: RuntimeDefault

crds:
  create: false

alloy:
  enableReporting: false
  # The readiness probe reaches Alloy through the Pod IP. This remains
  # cluster-internal because no Service or ingress is created for Alloy.
  listenAddr: 0.0.0.0
  storagePath: /var/lib/alloy
  mounts:
    varlog: false
    dockercontainers: false
    extra:
      - name: alloy-storage
        mountPath: /var/lib/alloy
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "demo_pods" {
        role = "pod"
        namespaces {
          names = ["demo"]
        }
      }

      discovery.relabel "demo_pod_logs" {
        targets = discovery.kubernetes.demo_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app"]
          separator     = "/"
          target_label  = "job"
        }
      }

      loki.source.kubernetes "demo_pod_logs" {
        targets    = discovery.relabel.demo_pod_logs.output
        forward_to = [loki.process.demo_pod_logs.receiver]
      }

      loki.process "demo_pod_logs" {
        stage.static_labels {
          values = {
            cluster = "aks-cloud-native-lab",
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  volumes:
    extra:
      - name: alloy-storage
        emptyDir: {}
  podDisruptionBudget:
    enabled: false

rbac:
  create: true
  namespaces:
    - demo
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
        - pods/log
      verbs:
        - get
        - list
        - watch
  clusterRules: []

service:
  enabled: false

serviceMonitor:
  enabled: false
