orderService:
  image:
    repository: order-service
    pullPolicy: IfNotPresent
  versions:
    - name: v1
      tag: v1
      replicaCount: 1
    - name: v2
      tag: v2
      replicaCount: 1
  userServiceUrl: http://user-service:8080
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
