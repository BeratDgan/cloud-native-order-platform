{{- range .Values.orderService.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-{{ .name }}
  labels:
    app: order-service
    version: {{ .name }}
    app.kubernetes.io/name: order-service
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      app: order-service
      version: {{ .name }}
  template:
    metadata:
      labels:
        app: order-service
        version: {{ .name }}
        app.kubernetes.io/name: order-service
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      imagePullSecrets:
        {{- toYaml $.Values.orderService.imagePullSecrets | nindent 8 }}
      containers:
        - name: order-service
          image: "{{ $.Values.orderService.image.repository }}:{{ .tag }}"
          imagePullPolicy: {{ $.Values.orderService.image.pullPolicy }}
          env:
            - name: APP_VERSION
              value: {{ .name | quote }}
            - name: USER_SERVICE_URL
              value: {{ $.Values.orderService.userServiceUrl | quote }}
          ports:
            - name: http
              containerPort: 8080

          # securityContext ile container için güvenlik önlemleri alındı
          #örneğin readOnlyRootFilesystem: true ile containerın root dosya sistemine yazma izni engellendi
          # runAsNonRoot ve runAsUser:1000 ile containerın root kullanıcısı olarak çalışması engellendi ve 1000 UID ile çalışması sağlandı
          # allowPrivilegeEscalation: sınırlı kullanıcıdan root'a yükselme engellendi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml $.Values.orderService.resources | indent 12 }}
{{- end }}
