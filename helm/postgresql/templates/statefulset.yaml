apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  labels:
    app: postgresql
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Values.postgresql.service.name }}
  replicas: {{ .Values.postgresql.replicaCount }}
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: {{ .Values.postgresql.securityContext.runAsUser }}
        fsGroup: {{ .Values.postgresql.securityContext.fsGroup }}
        runAsGroup: {{ .Values.postgresql.securityContext.runAsGroup }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}@{{ .Values.postgresql.image.digest }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database.name }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret.name }}
                  key: {{ .Values.postgresql.existingSecret.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret.name }}
                  key: {{ .Values.postgresql.existingSecret.passwordKey }}
            - name: PGDATA
              value: {{ .Values.postgresql.persistence.mountPath }}/{{ .Values.postgresql.persistence.pgDataSubdir }}
          volumeMounts:
            - name: postgresql-data
              mountPath: {{ .Values.postgresql.persistence.mountPath }}
          resources:
            limits:
              cpu: {{ .Values.postgresql.resources.limits.cpu }}
              memory: {{ .Values.postgresql.resources.limits.memory }}
            requests:
              cpu: {{ .Values.postgresql.resources.requests.cpu }}
              memory: {{ .Values.postgresql.resources.requests.memory }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: {{ .Values.postgresql.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.probes.periodSeconds }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: {{ .Values.postgresql.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgresql.probes.periodSeconds }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: {{ .Values.postgresql.probes.startupPeriodSeconds }}
            failureThreshold: {{ .Values.postgresql.probes.startupFailureThreshold }}
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          app: postgresql
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: {{ .Release.Name }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.postgresql.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
