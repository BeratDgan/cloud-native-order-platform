apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
    app.kubernetes.io/name: user-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.userService.replicaCount }}
  selector:
    matchLabels:
      app: user-service
      version: v1
  template:
    metadata:
      labels:
        app: user-service
        version: v1
        app.kubernetes.io/name: user-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}"
          imagePullPolicy: {{ .Values.userService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080

          # securityContext ile container için güvenlik önlemleri alındı
          #örneğin readOnlyRootFilesystem: true ile containerın root dosya sistemine yazma izni engellendi
          # runAsNonRoot ve runAsUser:1000 ile containerın root kullanıcısı olarak çalışması engellendi ve 1000 UID ile çalışması sağlandı
          # allowPrivilegeEscalation: sınırlı kullanıcıdan root'a yükselme engellendi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

                
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.userService.resources | indent 12 }}
