userService:
  replicaCount: 1
  image:
    repository: beratcloudnativeacr.azurecr.io/user-service
    tag: 5de38d6509dd0d95f6303f45fa3aa748b9be393f
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  
  imagePullSecrets:
    - name: acr-pull-secret

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 60
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 60

  vpa:
    enabled: false
    updateMode: "Off"
