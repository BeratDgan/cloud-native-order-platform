{{- if .Values.webApp.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-app
  labels:
    app: web-app
    app.kubernetes.io/name: web-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-app
  minReplicas: {{ .Values.webApp.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.webApp.autoscaling.maxReplicas }}
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: web-app
        target:
          type: Utilization
          averageUtilization: {{ .Values.webApp.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.webApp.autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
{{- end }}
