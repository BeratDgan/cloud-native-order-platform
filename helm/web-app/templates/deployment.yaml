{{- if .Values.webApp.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: web-app
  labels:
    app: web-app
    app.kubernetes.io/name: web-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if or .Values.webApp.rollout.enabled (not .Values.webApp.autoscaling.enabled) }}
  replicas: {{.Values.webApp.replicaCount }}
  {{- end }}
  {{- if .Values.webApp.rollout.enabled }}
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  progressDeadlineAbort: true
  strategy:
    canary:
      stableService: {{ .Values.webApp.rollout.stableService }}
      canaryService: {{ .Values.webApp.rollout.canaryService }}
      maxSurge: 1
      maxUnavailable: 0
      abortScaleDownDelaySeconds: 30
      trafficRouting:
        istio:
          virtualService:
            name: {{ .Values.webApp.rollout.virtualService }}
            routes:
              - {{ .Values.webApp.rollout.virtualServiceRoute }}
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: {{ .Values.webApp.rollout.analysisTemplate }}
        - setWeight: 50
        - pause:
            duration: 30s
  {{- end }}
  selector:
    matchLabels:
      app: web-app
      version: v1
  template:

    
    metadata:
      labels:
        app: web-app
        version: v1
        app.kubernetes.io/name: web-app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.webApp.imagePullSecrets | nindent 8 }}
      containers:
        - name: web-app
          image: "{{ .Values.webApp.image.repository }}:{{ .Values.webApp.image.tag }}"
          imagePullPolicy: {{ .Values.webApp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000

          # securityContext ile container için güvenlik önlemleri alındı
          #örneğin readOnlyRootFilesystem: true ile containerın root dosya sistemine yazma izni engellendi
          # runAsNonRoot ve runAsUser:1000 ile containerın root kullanıcısı olarak çalışması engellendi ve 1000 UID ile çalışması sağlandı
          # allowPrivilegeEscalation: sınırlı kullanıcıdan root'a yükselme engellendi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: ORDER_SERVICE_URL
              value: {{ .Values.webApp.orderServiceUrl | quote }}
            - name: CANARY_TEST_FAILURE
              value: {{ .Values.webApp.rollout.simulateFailure | quote }}
          resources:
{{ toYaml .Values.webApp.resources | indent 12 }}
