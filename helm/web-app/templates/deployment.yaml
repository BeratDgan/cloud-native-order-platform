apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: web-app
    app.kubernetes.io/name: web-app
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:

  
  replicas: {{.Values.webApp.replicaCount }}
  selector:
    matchLabels:
      app: web-app
      version: v1
  template:

    
    metadata:
      labels:
        app: web-app
        version: v1
        app.kubernetes.io/name: web-app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: web-app
          image: "{{ .Values.webApp.image.repository }}:{{ .Values.webApp.image.tag }}"
          imagePullPolicy: {{ .Values.webApp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
          env:
          - name: ORDER_SERVICE_URL
            value: {{ .Values.webApp.orderServiceUrl | quote }}
          resources:
{{ toYaml .Values.webApp.resources | indent 12 }}
