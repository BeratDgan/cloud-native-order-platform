apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-run-as-nonroot
  namespace: kyverno-demo
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires Pods or every container in the Pod to explicitly declare
      securityContext.runAsNonRoot as true.
spec:
  validationActions:
    - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        (object.spec.?securityContext.?runAsNonRoot.orValue(false) == true
          && variables.containers.all(container,
            container.?securityContext.?runAsNonRoot.orValue(true) == true))
        || variables.containers.all(container,
          container.?securityContext.?runAsNonRoot.orValue(false) == true)
      message: >-
        Root olarak çalışan container kabul edilmez. Pod seviyesinde
        spec.securityContext.runAsNonRoot=true ayarlanmalı veya bütün container,
        initContainer ve ephemeralContainer tanımlarında runAsNonRoot=true olmalıdır.
