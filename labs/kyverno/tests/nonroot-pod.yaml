apiVersion: v1
kind: Pod
metadata:
  name: nonroot-pod
  namespace: kyverno-demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nonroot-pod
      image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
      command:
        - /bin/sh
        - -c
        - sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
