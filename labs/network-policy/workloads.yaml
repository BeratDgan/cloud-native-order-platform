apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: network-policy-demo
  labels:
    app: echo-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
        - name: echo-server
        # busybox imajı kullanma sebebimiz, basit bir HTTP sunucusu çalıştırmak ve küçük boyutlu olmasıdır. Bu sayede ağ politikalarını test etmek için hızlı ve hafif bir çözüm sunar.
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          # HTTP sunucusunu başlatmak için komutları çalıştır.
          command: ["/bin/sh", "-c"]
          # Komutlar, /www dizinini oluşturur, bir index.html dosyası oluşturur ve ardından httpd sunucusunu başlatır.
          args:
            - mkdir -p /www &&
              echo "network-policy-ok" > /www/index.html &&
              exec httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
#Service
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: network-policy-demo
spec:
  type: ClusterIP
  selector:
    app: echo-server
  ports:
  - port: 8080
    targetPort: 8080

---
#allow-client pod tag olarak access: allowed ile işaretlenmiştir. Bu sayede, ağ politikaları tarafından bu pod'a erişim izni verilecektir.
apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  namespace: network-policy-demo
  labels:
    access: allowed
spec:
  containers:
    - name: allowed-client
      image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
      command: ["/bin/sh", "-c"]
      args:
        - while true; do wget -qO- http://echo-server.network-policy-demo.svc.cluster.local:8080; sleep 5; done
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
---
# blocked-client pod tag olarak access: blocked ile işaretlenmiştir. Bu sayede, ağ politikaları tarafından bu pod'a erişim izni verilmeyecektir.
apiVersion: v1
kind: Pod
metadata:
  name: blocked-client
  namespace: network-policy-demo
  labels:
    access: blocked
spec:
  containers:
    - name: blocked-client
      image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
      command: ["/bin/sh", "-c"]
      args:
        - while true; do wget -qO- http://echo-server.network-policy-demo.svc.cluster.local:8080; sleep 5; done
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"


