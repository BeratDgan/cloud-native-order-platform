#pr açıldığında ve main'e pushlandığında çalışacak
name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

  # Pipeline'ın kod okuma ve id-token izinleri olacak
  # id-token write izni, Actions runner'ı Azure'un güvendiği OIDC token'ı üretilmesine izin verir
permissions:
  contents: read
  id-token: write

# Node.js 24 kullanacak
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true # Herhangi bir servis testi/build'i başarısız olursa pipeline anında kırılır
      matrix:
        service: [user-service, web-app, order-service] # matrix burada tanımlanıyor, her bir servis için ayrı job çalışacak

# üç service için test çalıştıracak
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false  

      # Her servis için test 1 kere çalışır
      - name: Install dependencies and test
        working-directory: services/${{ matrix.service }}
        run: |
          npm ci
          npm test
# user-service ve web-app için standart build
      - name: Build Docker Image (Standard Services)
        if: matrix.service != 'order-service'
        run: |
          docker build -t ${{ matrix.service }}:test services/${{ matrix.service }}

# order-service için aynı Dockerfile üzerinden V1 build argümanı
      - name: Build Docker Image (order-service v1)
        if: matrix.service == 'order-service'
        run: |
          docker build \
            --build-arg APP_VERSION=v1 \
            -t order-service:v1-test \
            services/order-service

# order-service için aynı Dockerfile üzerinden V2 build argümanı
      - name: Build Docker Image (order-service v2)
        if: matrix.service == 'order-service'
        run: |
          docker build \
            --build-arg APP_VERSION=v2 \
            -t order-service:v2-test \
            services/order-service
      

      - name: Trivy Scan (Standard Services)
        if: matrix.service != 'order-service'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ matrix.service }}:test'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          ignore-unfixed: true # henüz çözülmemiş güvenlik açıklarını ignore et
          vuln-type: 'os,library' # hem işletim sistemi hem de kütüphane güvenlik açıklarını tarat

      # order-service v1 (İlk çağrı: Trivy indirilir ve kurulur)
      - name: Trivy Scan (order-service v1)
        if: matrix.service == 'order-service'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'order-service:v1-test'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # order-service v2 (İkinci çağrı: Yeniden kurulum ATLANIR)
      - name: Trivy Scan (order-service v2)
        if: matrix.service == 'order-service'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'order-service:v2-test'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      # --- Aşağıdaki adımlar SADECE push + main durumunda çalışır ---
      # PR'da bu noktaya kadar her şey çalışır, buradan sonrası skip edilir

      - name: Azure Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name ${{ vars.ACR_NAME }}

      # burada user-service ve web-app için tag ve push işlemleri yapılıyor
      # latest yerine sha ile tagleniyor bu her build'in unique olmasını sağlıyor ve hangi commitin hangi image'i build ettiğini anlamamızı sağlıyor
      - name: Tag and Push (Standard Services)
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          matrix.service != 'order-service'
        run: |
          docker tag ${{ matrix.service }}:test ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.service }}:${{ github.sha }}

      # burada order-service v1 ve v2 için tag ve push işlemleri yapılıyor
      - name: Tag and Push (order-service v1 & v2)
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          matrix.service == 'order-service'
        run: |
          docker tag order-service:v1-test ${{ vars.ACR_LOGIN_SERVER }}/order-service:v1-${{ github.sha }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/order-service:v1-${{ github.sha }}
          docker tag order-service:v2-test ${{ vars.ACR_LOGIN_SERVER }}/order-service:v2-${{ github.sha }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/order-service:v2-${{ github.sha }}


# Helm chartları için lint çalıştıracak
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint and render Helm charts
        run: |
          for chart in ./helm/*; do
            helm lint "$chart"
            helm template "$(basename "$chart")" "$chart" --namespace demo > /dev/null
          done
# Herhangi bir test, image build veya Helm kontrolü başarısızsa pipeline kırılacak.
