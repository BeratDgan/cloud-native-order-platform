apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: order-service
  namespace: demo
spec:
  host: order-service.demo.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
