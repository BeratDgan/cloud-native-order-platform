apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: application-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - demo
  # pod seçicisi app etiketi user-service veya order-service olan servisleri seçer
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - user-service
          - order-service
  podMetricsEndpoints:
    - portNumber: 15020
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s