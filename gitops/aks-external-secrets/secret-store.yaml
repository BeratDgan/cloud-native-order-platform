# secret store dosyası sayesinde ESO'ya Azure Key Vault'a nasıl bağlancağını söylüyoruz
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
  namespace: demo
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      environmentType: PublicCloud
      vaultUrl: "https://kv-berat-cloudnative.vault.azure.net"
      # Client ID ve tenant ID referans verilen ServiceAccount'tan okunur.
      # tenantId burada da tanimlanirsa ESO birden fazla kimlik kaynagini reddeder.
      serviceAccountRef:
        name: external-secrets-key-vault
