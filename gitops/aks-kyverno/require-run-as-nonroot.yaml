# Mevcut laboratuvar kapsaminda kalir; Istio'nun root istio-init container'ina
# genel bir istisna acmak yerine injection olmayan kyverno-demo'da uygulanir.
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-run-as-nonroot
  namespace: kyverno-demo
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(
            object.spec.?securityContext.?runAsNonRoot.orValue(false)) == true
          && c.?securityContext.?runAsUser.orValue(
            object.spec.?securityContext.?runAsUser.orValue(1)) != 0)
      message: >-
        Root container reddedildi: tum container'lar runAsNonRoot=true
        kullanmali ve etkin runAsUser degeri 0 olmamali.
